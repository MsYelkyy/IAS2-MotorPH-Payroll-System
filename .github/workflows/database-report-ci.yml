name: Database Report CI/CD Pipeline

# Rebuilds and validates the MotorPH database reporting layer in a clean MySQL 8
# database, then runs the report tests. This does not deploy to production and
# does not build or test the Java app (no Maven; src, pom.xml, and target are
# left untouched).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  database-report:
    name: Build & validate reporting layer (MySQL 8)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait for MySQL to be ready
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              echo "MySQL is up."
              exit 0
            fi
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done
          echo "MySQL did not become ready in time." >&2
          exit 1

      - name: Deploy reporting layer (schema + data + seed + views)
        working-directory: database/ci-cd
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot \
            --default-character-set=utf8mb4 \
            < deploy_reports.sql

      - name: Run all report validation tests
        working-directory: database/ci-cd
        run: |
          # Save the full test output to a log, and show it in the console too.
          mysql -h 127.0.0.1 -P 3306 -uroot -proot \
            --default-character-set=utf8mb4 --table \
            < run_all_tests.sql | tee test_output.log

      - name: Check test results
        working-directory: database/ci-cd
        run: |
          set -euo pipefail

          # Fail only on a real failure: a FAIL result cell (shown as "| FAIL |")
          # or a "TEST(S) FAILED" verdict. We do not match the plain word "FAIL",
          # because a passing run still prints the "failed" column header and one
          # label that reads "...if FAIL".
          if grep -Eq '\|[[:space:]]*FAIL[[:space:]]*\||TEST\(S\) FAILED' test_output.log; then
            echo "::error::Report tests failed. Failing rows / verdicts:"
            grep -En '\|[[:space:]]*FAIL[[:space:]]*\||TEST\(S\) FAILED' test_output.log || true
            exit 1
          fi

          # Make sure the tests actually ran (a run with no PASS cells is wrong).
          if ! grep -Eq '\|[[:space:]]*PASS[[:space:]]*\|' test_output.log; then
            echo "::error::No PASS results found -- the tests did not run as expected."
            exit 1
          fi

          echo "All report tests passed."

      - name: Upload test output log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-report-test-output
          path: database/ci-cd/test_output.log
          if-no-files-found: warn
