name: Database Report CI/CD Pipeline

# Rebuilds and validates the MotorPH database REPORTING LAYER in a clean MySQL 8
# environment. This is NOT a production deployment pipeline: it stands up the
# reporting layer on a throwaway MySQL service container and runs the report
# validation tests. It never builds/tests the Java app and never touches
# src/main/java, src/main/resources, pom.xml, or target/.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  database-report:
    name: Build & validate reporting layer (MySQL 8)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait for MySQL to be ready
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              echo "MySQL is up."
              exit 0
            fi
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done
          echo "MySQL did not become ready in time." >&2
          exit 1

      - name: Deploy reporting layer (schema + data + seed + views)
        working-directory: database/ci-cd
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot \
            --default-character-set=utf8mb4 \
            < deploy_reports.sql

      - name: Run all report validation tests
        working-directory: database/ci-cd
        run: |
          # Capture the full test output (table grids + verdicts) to a log.
          # 'tee' keeps it visible in the Actions console too.
          mysql -h 127.0.0.1 -P 3306 -uroot -proot \
            --default-character-set=utf8mb4 --table \
            < run_all_tests.sql | tee test_output.log

      - name: Evaluate pass/fail gate
        working-directory: database/ci-cd
        run: |
          set -euo pipefail

          echo "Scanning test_output.log for real failures..."

          # A REAL failure is either:
          #   1) a FAIL result cell in a --table grid, rendered as "| FAIL |"
          #      (optional surrounding whitespace inside the pipes), OR
          #   2) a "TEST(S) FAILED" verdict line.
          #
          # We intentionally do NOT match the bare word FAIL, because a PASSING
          # run still prints:
          #   * the lowercase "failed" column header, and
          #   * one scenario label containing "...if FAIL".
          # Those are not failures and must not trip the gate.
          if grep -Eq '\|[[:space:]]*FAIL[[:space:]]*\||TEST\(S\) FAILED' test_output.log; then
            echo "::error::Report validation FAILED. Failing rows / verdicts:"
            grep -En '\|[[:space:]]*FAIL[[:space:]]*\||TEST\(S\) FAILED' test_output.log || true
            exit 1
          fi

          # Sanity check: make sure the suite actually ran and produced PASS
          # results (guards against a silent no-op that would otherwise "pass").
          if ! grep -Eq '\|[[:space:]]*PASS[[:space:]]*\|' test_output.log; then
            echo "::error::No PASS result cells found -- the test suite did not run as expected."
            exit 1
          fi

          echo "All report validation tests passed."

      - name: Upload test output log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-report-test-output
          path: database/ci-cd/test_output.log
          if-no-files-found: warn
