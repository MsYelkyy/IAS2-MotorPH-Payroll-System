server:
  port: 8080

spring:
  application:
    name: motorph-backend
  datasource:
    url: jdbc:mysql://${MOTORPH_DB_HOST:localhost}:${MOTORPH_DB_PORT:3306}/payrollsystem_db?useSSL=false&allowPublicKeyRetrieval=true
    username: ${MOTORPH_DB_USER}
    password: ${MOTORPH_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  profiles:
    active: ${MOTORPH_PROFILE:default}

motorph:
  jwt:
    secret: ${MOTORPH_JWT_SECRET}
    access-expiry-minutes: ${MOTORPH_JWT_ACCESS_EXPIRY_MINUTES:15}
    refresh-expiry-minutes: ${MOTORPH_JWT_REFRESH_EXPIRY_MINUTES:1440}
  photo:
    # employee profile photos are stored on the backend host and served over the API
    directory: ${MOTORPH_PHOTO_DIR:profile-photos}
  backup:
    # database dumps live on the backend host, not next to the desktop client
    directory: ${MOTORPH_BACKUP_DIR:backups}
  auth:
    otp-challenge-expiry-minutes: 10
    lockout:
      max-failed-password-attempts: ${MOTORPH_AUTH_MAX_FAILED_PASSWORD_ATTEMPTS:5}
    login-rate-limit:
      max-attempts: 10
      window-minutes: 1
